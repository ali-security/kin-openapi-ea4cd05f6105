name: ShellCheck

on:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Run shellcheck
      uses: ludeeus/action-shellcheck@1.1.0
      with:
        check_together: 'yes'
        severity: error
